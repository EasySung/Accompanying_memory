<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>추억 앨범</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="../styles/tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .alb-head { padding:6px 22px 0; }
  .srch { width:46px; height:46px; border-radius:15px; background:#fff; box-shadow:var(--sh-sm);
    display:flex; align-items:center; justify-content:center; }
  .srch svg { width:22px; color:var(--text); }

  .tabs { display:flex; gap:8px; overflow-x:auto; padding:18px 22px 4px; }
  .tabs::-webkit-scrollbar{ height:0; }
  .tab { flex:0 0 auto; height:42px; padding:0 18px; border-radius:99px; font-size:15px; font-weight:700;
    background:#fff; border:1.5px solid var(--border); color:var(--text-2); display:flex; align-items:center; }
  .tab.on { background:var(--text); color:#fff; border-color:var(--text); }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 22px 24px; }
  .mcard { border-radius:var(--r-lg); overflow:hidden; background:#fff; border:1px solid var(--border-soft);
    box-shadow:var(--sh-sm); cursor:pointer; transition:transform .14s ease; }
  .mcard:active{ transform:scale(.97); }
  .mcard .thumb { height:118px; display:flex; align-items:center; justify-content:center; position:relative; }
  .mcard .thumb .ic { width:50px; height:50px; border-radius:16px; background:rgba(255,255,255,.65);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .mcard .thumb .ic svg { width:26px; }
  .th-blue{ background: linear-gradient(150deg,#DCEAFB,#C3DBF7);} .th-blue .ic svg{color:var(--primary);}
  .th-coral{ background: linear-gradient(150deg,#FCE4D2,#F8D2B7);} .th-coral .ic svg{color:var(--accent-deep);}
  .th-mint{ background: linear-gradient(150deg,#D6EEE8,#BFE5DB);} .th-mint .ic svg{color:var(--mint);}
  .th-sun{ background: linear-gradient(150deg,#FAEFCF,#F5E2A8);} .th-sun .ic svg{color:#C99A2E;}
  .mcard .info { padding:13px 14px 15px; }
  .mcard .mt { font-size:16px; font-weight:800; letter-spacing:-0.02em; }
  .mcard .meta { font-size:12.5px; font-weight:600; color:var(--text-2); margin-top:5px;
    display:flex; align-items:center; gap:5px; }
  .mcard .meta svg { width:13px; }

  .alb-title { font-size:27px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; }
  .alb-head .cap { white-space:nowrap; }
</style>
</head>
<body>
<div class="screen" data-screen-label="추억 앨범">
  <div class="body">
    <div class="alb-head">
      <div class="row between center">
        <div>
          <div class="cap" style="color:var(--accent-deep);">함께 모은 순간들</div>
          <div class="alb-title" style="margin-top:4px;">추억 앨범</div>
        </div>
        <div class="srch"><i data-lucide="search"></i></div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab on">전체</div>
      <div class="tab">가족</div>
      <div class="tab">여행</div>
      <div class="tab">일상</div>
      <div class="tab">명절</div>
    </div>

    <div class="grid">
      <div class="mcard">
        <div class="thumb th-blue"><div class="ic"><i data-lucide="waves"></i></div></div>
        <div class="info">
          <div class="mt">가족 바닷가 여행</div>
          <div class="meta"><i data-lucide="map-pin"></i>강릉 · 1998</div>
        </div>
      </div>
      <div class="mcard">
        <div class="thumb th-coral"><div class="ic"><i data-lucide="cake"></i></div></div>
        <div class="info">
          <div class="mt">막내 돌잔치</div>
          <div class="meta"><i data-lucide="map-pin"></i>집 · 1990</div>
        </div>
      </div>
      <div class="mcard">
        <div class="thumb th-mint"><div class="ic"><i data-lucide="mountain"></i></div></div>
        <div class="info">
          <div class="mt">설악산 단풍놀이</div>
          <div class="meta"><i data-lucide="map-pin"></i>설악산 · 2005</div>
        </div>
      </div>
      <div class="mcard">
        <div class="thumb th-sun"><div class="ic"><i data-lucide="utensils"></i></div></div>
        <div class="info">
          <div class="mt">추석 온 가족 모임</div>
          <div class="meta"><i data-lucide="map-pin"></i>고향집 · 2012</div>
        </div>
      </div>
      <div class="mcard">
        <div class="thumb th-coral"><div class="ic"><i data-lucide="flower-2"></i></div></div>
        <div class="info">
          <div class="mt">봄 벚꽃 산책</div>
          <div class="meta"><i data-lucide="map-pin"></i>여의도 · 2019</div>
        </div>
      </div>
      <div class="mcard">
        <div class="thumb th-blue"><div class="ic"><i data-lucide="graduation-cap"></i></div></div>
        <div class="info">
          <div class="mt">손주 졸업식</div>
          <div class="meta"><i data-lucide="map-pin"></i>서울 · 2021</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../styles/app.js"></script>
<script>mountChrome({});</script>
</body>
</html>
